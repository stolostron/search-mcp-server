{{/*
  ACM-32474 (SAR-09): database credential auto-discovery.

  Historically this chart reused the ACM "search-postgres" Secret, which holds the
  read-write "searchuser" admin credential. That gave search-mcp-server far more
  database privilege than it needs (it only ever runs SELECTs).

  search-v2-operator now provisions a dedicated read-only role ("search_mcp_ro") and
  exposes it via the "search-postgres-mcp-readonly" Secret (merged in
  stolostron/search-v2-operator#737, shipping in ACM 5.0+ / MCE with that operator
  version). We prefer that Secret here.

  search-mcp-server has its own, separate release cadence from ACM/MCE, so this chart
  may be installed/upgraded against a hub whose search-v2-operator hasn't been upgraded
  yet and therefore hasn't created "search-postgres-mcp-readonly". To avoid breaking
  those installs, we fall back to the legacy "search-postgres" admin Secret when the
  read-only Secret isn't found yet.

  TODO(ACM-32474): once the minimum supported ACM/MCE version always ships
  search-v2-operator with the read-only Secret, remove the fallback branch below and
  the "search-postgres" lookup entirely.
*/}}
{{- $databaseUrl := "" }}

{{- if .Values.database.autoDiscover }}
  {{- $mchList := lookup "operator.open-cluster-management.io/v1" "MultiClusterHub" "" "" }}
  {{- if $mchList.items }}
    {{- $mch := index $mchList.items 0 }}
    {{- $acmNamespace := $mch.metadata.namespace }}
    {{- $dbHost := printf "search-postgres.%s.svc.cluster.local" $acmNamespace }}

    {{- $mcpSecret := lookup "v1" "Secret" $acmNamespace "search-postgres-mcp-readonly" }}
    {{- if $mcpSecret }}
      {{- $dbUser := index $mcpSecret.data "database-user" | b64dec }}
      {{- $dbPass := index $mcpSecret.data "database-password" | b64dec }}
      {{- $dbName := index $mcpSecret.data "database-name" | b64dec }}
      {{- if and $dbUser $dbPass $dbName }}
        {{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" $dbUser $dbPass $dbHost $dbName }}
      {{- end }}
    {{- else }}
      {{/* Fallback for hubs running a search-v2-operator that predates ACM-32474. */}}
      {{- $searchSecret := lookup "v1" "Secret" $acmNamespace "search-postgres" }}
      {{- if $searchSecret }}
        {{- $dbUser := index $searchSecret.data "database-user" | b64dec }}
        {{- $dbPass := index $searchSecret.data "database-password" | b64dec }}
        {{- $dbName := index $searchSecret.data "database-name" | b64dec }}
        {{- if and $dbUser $dbPass $dbName }}
          {{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" $dbUser $dbPass $dbHost $dbName }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- else }}
  {{- $databaseUrl = .Values.database.url }}
{{- end }}

{{/*
  Only hard-fail during a real install/upgrade. `helm lint` and `helm template` never
  perform live cluster lookups (lookup always returns empty), so $databaseUrl would
  always be empty there even on a correctly configured cluster — failing in that context
  would make `helm lint`/`helm template` unusable for static chart validation.
*/}}
{{- if and (not $databaseUrl) (or .Release.IsInstall .Release.IsUpgrade) }}
  {{- if .Values.database.autoDiscover }}
    {{- fail "acm-mcp-server: could not determine the database connection URL. With database.autoDiscover=true, neither the search-postgres-mcp-readonly nor the search-postgres Secret was found with non-empty database-user, database-password, and database-name fields (or no MultiClusterHub resource exists) in the ACM namespace — verify ACM/MCE with Search is installed. Alternatively, set database.autoDiscover=false and provide database.url explicitly." }}
  {{- else }}
    {{- fail "acm-mcp-server: database.url is required when database.autoDiscover=false — set database.url to a valid PostgreSQL connection URL (e.g. postgresql://user:password@host:5432/dbname)." }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acm-mcp-server.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ $databaseUrl | b64enc }}